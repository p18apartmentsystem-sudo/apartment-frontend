<!-- ================= MY PROFILE ================= -->
<div class="card p-4 mb-5 profile-card">

  <!-- Header -->
  <div class="d-flex justify-content-between align-items-center mb-4">
    <div>
      <h3 class="fw-bolder mb-1">My Profile</h3>
      <div class="text-muted small">
        Manage your personal information
      </div>
    </div>

    <!-- ✏️ EDIT BUTTON -->
    <button
      *ngIf="!isEditMode"
      class="btn btn-light-primary btn-icon"
      (click)="isEditMode = true"
      title="Edit Profile"
    >
      <i class="bi bi-pencil fs-4"></i>
    </button>
  </div>

  <!-- BASIC INFO -->
  <div class="row mb-4">

    <!-- NAME -->
    <div class="col-12 col-md-6 mb-4">
      <label class="fw-bolder text-success">Name</label>
      <input
        type="text"
        [(ngModel)]="profile.name"
        class="form-control form-control-lg"
        [readonly]="!isEditMode"
        (input)="toUppercase($event)"
      />
    </div>

    <!-- MOBILE -->
    <div class="col-12 col-md-6 mb-4">
      <label class="fw-bolder text-success">Mobile</label>
      <input
        type="text"
        [(ngModel)]="profile.mobile"
        class="form-control form-control-lg"
        [readonly]="!isEditMode"
      />
    </div>

  </div>

  <!-- EMAIL + OTP -->
  <div class="row mb-4">

    <!-- EMAIL -->
    <div class="col-12 col-md-6 mb-4">
      <label class="fw-bolder text-success">Email</label>
      <input
        type="email"
        [(ngModel)]="profile.email"
        class="form-control form-control-lg"
        [readonly]="!isEditMode"
      />

      <div class="mt-2">
        <span *ngIf="profile.emailVerified" class="badge badge-light-success">
          ✅ Email Verified
        </span>
        <span *ngIf="!profile.emailVerified" class="badge badge-light-danger">
          ❌ Email Not Verified
        </span>
      </div>
    </div>

    <!-- OTP BOX -->
    <div class="col-12 col-md-6" *ngIf="showOtpBox">
      <label class="fw-bolder text-success">OTP Verification</label>
      <input
        type="text"
        [(ngModel)]="otp"
        placeholder="Enter OTP"
        class="form-control form-control-lg mb-3"
      />

      <button
        class="btn btn-success w-100 fw-bolder"
        (click)="verifyOtp()"
      >
        Submit OTP
      </button>
    </div>

  </div>

  <!-- ACTION BUTTONS (EDIT MODE ONLY) -->
  <div
    *ngIf="isEditMode"
    class="d-flex justify-content-center gap-4 mt-4"
  >
    <button
      class="btn btn-primary px-5 fw-bolder"
      (click)="updateProfile(); isEditMode = false"
    >
      Update Profile
    </button>

    <button
      class="btn btn-light-danger px-5 fw-bolder"
      (click)="isEditMode = false"
    >
      Cancel
    </button>

    <button
      *ngIf="!profile.emailVerified"
      class="btn btn-warning px-5 fw-bolder"
      (click)="sendOtp()"
    >
      Verify Email
    </button>
  </div>

</div>

<!-- ================= ROLE BASED INFO ================= -->

<!-- APARTMENT ADMIN -->
<div class="card p-4 mb-4" *ngIf="profile.role === 'apartment_admin'">
  <h5 class="fw-bolder mb-3">Apartment Details</h5>

  <div class="row">
    <div class="col-12 col-md-6">
      <label class="fw-bolder text-success">Apartment</label>
      <input
        type="text"
        [(ngModel)]="profile.apartmentId.name"
        class="form-control form-control-lg"
        readonly
      />
    </div>
  </div>
</div>

<!-- FLAT ADMIN -->
<div class="card p-4 mb-4" *ngIf="profile.role === 'flat_admin'">
  <h5 class="fw-bolder mb-3">Flat Details</h5>

  <div class="row">

    <div class="col-12 col-md-6 mb-4">
      <label class="fw-bolder text-success">Apartment</label>
      <input
        type="text"
        [(ngModel)]="profile.apartmentId.name"
        class="form-control form-control-lg"
        readonly
      />
    </div>

    <div class="col-12 col-md-6 mb-4">
      <label class="fw-bolder text-success">Flat</label>
      <input
        type="text"
        [(ngModel)]="profile.flatId.flatNumber"
        class="form-control form-control-lg"
        readonly
      />
    </div>

  </div>
</div>
