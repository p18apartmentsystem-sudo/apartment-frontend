<div class="card p-4">
    <h3>My Profile</h3>
    <div class="row mb-4">
        <div class="col-12 col-md-6 ">
            <div class="form-group mb-2">
                <label  class="fw-bolder text-success">Name</label>
                <input type="text" [(ngModel)]="profile.name" class="form-control" (input)="toUppercase($event)">
            </div>
        </div>
        
        <div class="col-12 col-md-6 ">
            <div class="form-group mb-2">
                <label  class="fw-bolder text-success">Mobile</label>
                <input type="text" [(ngModel)]="profile.mobile" class="form-control">
            </div>
        </div>
    </div>

    <div class="row mb-4">
        <div class="col-12 col-md-6 ">
            <div class="form-group mb-2">
                <label  class="fw-bolder text-success">Email</label>
                <input type="email" [(ngModel)]="profile.email" class="form-control">
            </div>

            <div class="mb-2">
                <span *ngIf="profile.emailVerified" class="text-success">
                    ✅ Email Verified
                </span>

                <span *ngIf="!profile.emailVerified" class="text-danger">
                    ❌ Email Not Verified
                </span>
            </div>
        </div>
        <div class="col-12 col-md-6">
            <!-- OTP BOX -->
            <div *ngIf="showOtpBox" class="mt-3">
                <label  class="fw-bolder text-success">OTP</label>
                <input type="text" [(ngModel)]="otp" placeholder="Enter OTP" class="form-control mb-2">
                <div class="d-flex justify-content-center gap-3 mt-4">
                    <button class="btn btn-success" (click)="verifyOtp()">
                        Submit OTP
                    </button>
                </div>
            </div>
        </div>
    </div>


    <div class="d-flex justify-content-center gap-3 mt-4">
        <button class="btn btn-primary me-2" (click)="updateProfile()">
            Update Profile
        </button>
        <button *ngIf="!profile.emailVerified" class="btn btn-warning" (click)="sendOtp()">
            Verify Email
        </button>
    </div>


</div>

<div class="card p-4" *ngIf="profile.role == 'apartment_admin' ">
    <div class="row mb-4">
        <div class="col-12 col-md-6 ">
            <div class="form-group mb-2" *ngIf="profile.apartmentId.name">
                <label  class="fw-bolder text-success">Apartment</label>
                <input type="text" [(ngModel)]="profile.apartmentId.name" class="form-control" readonly>
            </div>
        </div>
    </div>
</div>

<div class="card p-4" *ngIf="profile.role == 'flat_admin' ">
    <div class="row mb-4">
        <div class="col-12 col-md-6 ">
            <div class="form-group mb-2" *ngIf="profile.apartmentId.name">
                <label  class="fw-bolder text-success">Apartment</label>
                <input type="text" [(ngModel)]="profile.apartmentId.name" class="form-control" readonly>
            </div>
        </div>
        
        <div class="col-12 col-md-6 ">
            <div class="form-group mb-2" *ngIf="profile.flatId.flatNumber">
                <label  class="fw-bolder text-success">Flat</label>
                <input type="text" [(ngModel)]="profile.flatId.flatNumber" class="form-control" readonly>
            </div>
        </div>
    </div>
</div>
