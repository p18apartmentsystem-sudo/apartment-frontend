<!-- begin::Header -->
<div class="card-header border-0 pt-5 d-flex justify-content-end">
    <div class="card-toolbar" data-bs-toggle="tooltip" data-bs-placement="top" data-bs-trigger="hover"
        title="Click to add Admin">

        <button type="button" class="btn btn-success" (click)="openAddModal(addModal, id)">
            + Add Admin
        </button>

    </div>
</div>
<!-- end::Header -->

<!-- begin::Body -->
<div class="card-body py-3">
    <!-- begin::Table container -->
    <div class="table-responsive custom-scroll">
        <!-- begin::Table -->
        <table class="table table-row-dashed table-row-gray-300 align-middle gs-0 gy-4  text-nowrap">
            <!-- begin::Table head -->
            <thead>
                <tr class="fw-bolder">
                    <th class="text-uppercase"><span class="fs-6 fw-bolder" style="color: #f6c000"> SR </span></th>
                    <th class="min-w-150px text-uppercase"><span class="fs-6 fw-bolder" style="color: #17c653">
                            FLAT
                        </span></th>
                    <th class="min-w-150px text-uppercase"><span class="fs-6 fw-bolder" style="color: #17c653"> NAME
                        </span></th>
                    <th class="min-w-140px text-uppercase"><span class="fs-6 fw-bolder" style="color: #7239ea"> MOBILE
                        </span></th>
                    <th class="min-w-140px text-uppercase"><span class="fs-6 fw-bolder"
                            style="color: #17c653">JOINED</span>
                    </th>
                    <th class="min-w-140px text-uppercase"><span class="badge badge-light-warning fs-6 fw-bolder">
                            Status </span></th>
                    <th class="min-w-100px text-uppercase text-center"><span class="fs-6 fw-bolder"
                            style="color: red">Actions</span></th>
                </tr>
            </thead>
            <!-- end::Table head -->
            <!-- begin::Table body -->
            <tbody>
                <tr *ngFor="let data of admins; let i = index ">
                    <td> {{ i + 1 }} </td>
                    <td>
                        <span *ngIf="data.apartmentId" data-bs-trigger="hover" [title]="data.apartmentId.address">
                            {{data.apartmentId.name}}
                        </span>
                        <span *ngIf="!data.apartmentId">
                            Not Added
                        </span>
                    </td>
                    <td> {{ data.name }} </td>
                    <td> {{ data.mobile}} </td>
                    <td> {{ data.createdAt | date: 'dd MMM, YYYY'}} </td>
                    <td>
                        <span *ngIf="data.isActive">
                            Active
                        </span>
                        <span *ngIf="!data.isActive">
                            In-Active
                        </span>
                    </td>
                    <td>
                        <div class="d-flex justify-content-center flex-shrink-0">
                            <a class="
                  btn btn-icon btn-bg-light btn-active-color-primary btn-sm
                  me-1
                " (click)="openUpdateModal(addModal, data._id, data)">
                                <span class="badge badge-light-warning fs-6 fw-bolder">
                                    <app-keenicon name="pencil" class="fs-3"></app-keenicon>
                                </span>
                            </a>
                            <a class="
                  btn btn-icon btn-bg-light btn-active-color-primary btn-sm
                " (click)="deleteUser(data._id)">
                                <span class="badge badge-light-danger fs-6 fw-bolder">
                                    <app-keenicon name="trash" class="fs-3"></app-keenicon>
                                </span>
                            </a>
                        </div>
                    </td>

                </tr>
            </tbody>
            <!-- end::Table body -->
        </table>
        <!-- end::Table -->
    </div>
    <!-- end::Table container -->

</div>
<!-- end::Body -->

<!-- begin:: modal template -->
<ng-template #addModal let-c="close" let-d="dismiss">

    <div class="modal-header d-flex justify-content-between align-items-center">
        <h4 class="mb-0">
            <span *ngIf="isAdd">Add Admin</span>
            <span *ngIf="!isAdd">Update Admin</span>
        </h4>

        <button type="button" class="btn btn-danger btn-sm" aria-label="Close" (click)="d('Cross click')">
            <span aria-hidden="true">&times;</span>
        </button>
    </div>

    <div class="modal-body">
        <form [formGroup]="adminForm">

            <!-- NAME -->
            <div class="row mb-4">
                <div class="col-12 col-md-6 mx-auto">
                    <label class="fw-bolder text-success">
                        Name <span class="text-danger">*</span>
                    </label>

                    <input type="text" class="form-control form-control-lg" placeholder="Admin Name"
                        formControlName="name"
                         appUppercase>
                </div>
            </div>

            <!-- MOBILE -->
            <div class="row mb-4">
                <div class="col-12 col-md-6 mx-auto">
                    <label class="fw-bolder text-success">
                        Mobile <span class="text-danger">*</span>
                    </label>

                    <input type="number" class="form-control form-control-lg" placeholder="Mobile Number"
                        formControlName="mobile" onkeypress="return this.value.length < 10;"
                        [class.is-invalid]="adminMobile?.invalid && (adminMobile?.touched || adminMobile?.dirty)">

                    <div *ngIf="adminMobile?.invalid && (adminMobile?.touched || adminMobile?.dirty)" class="mt-1">
                        <small *ngIf="adminMobile?.errors?.required" class="text-danger">
                            Mobile Number is required
                        </small>
                        <small *ngIf="adminMobile?.errors?.pattern" class="text-danger">
                            Please enter valid 10 Digit Mobile Number
                        </small>
                    </div>
                </div>
            </div>

            <!-- PASSWORD (ADD ONLY) -->
            <div class="row mb-4" *ngIf="isAdd">
                <div class="col-12 col-md-6 mx-auto">
                    <label class="fw-bolder text-success">
                        Password <span class="text-danger">*</span>
                    </label>

                    <input type="text" class="form-control form-control-lg" placeholder="Password"
                        formControlName="password">
                </div>
            </div>

        </form>
        <br>
        <!-- ACTION BUTTONS -->
        <div class="d-flex justify-content-center gap-3 mt-4" *ngIf="isAdd">
            <button class="btn btn-success px-5" (click)="addAdmin()">Submit</button>
            <button class="btn btn-danger px-5" (click)="closeModal()">Cancel</button>
        </div>

        <div class="d-flex justify-content-center gap-3 mt-4" *ngIf="!isAdd">
            <button class="btn btn-warning px-5" (click)="updateAdmin()">Update</button>
            <button class="btn btn-danger px-5" (click)="closeModal()">Cancel</button>
        </div>

    </div>

</ng-template>
<!-- end:: modal template -->
