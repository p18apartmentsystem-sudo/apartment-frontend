<div class="container mt-3">

    <!-- MONTH DROPDOWN -->
    <div class="card shadow-sm p-3 mb-3">
        <form [formGroup]="paymentForm">
            <div class="mb-3">
                <label class="fw-bolder text-success mb-1">
                    Month <span class="text-danger">*</span>
                </label>

                <select class="form-select form-select-lg" formControlName="monthYear"
                    (change)="selectMonthYear($event)">

                    <option value="">Select Month</option>

                    <option *ngFor="let item of month" [value]="item.monthYr">
                        {{ item.monthYr }}
                    </option>

                </select>
            </div>
        </form>
    </div>

    <div class="container-fluid mt-3">

        <!-- Summary -->
        <div class="row text-center g-2 align-items-center">

            <div class="col-4 col-md">
                <div class="fw-bold"></div>
                <span class="badge fs-4 px-3 py-2">
                    Total Flats
                </span>
            </div>

            <div class="col-4 col-md">
                <div class="fw-bold">Rent Paid</div>
                <span class="badge bg-success fs-4 px-3 py-2">
                    {{rentPaid}}
                </span>
            </div>

            <div class="col-4 col-md">
                <div class="fw-bold">Rent Pending</div>
                <span class="badge bg-danger fs-4 px-3 py-2">
                    {{rentPending}}
                </span>
            </div>

            <div class="col-4 col-md">
                <div class="fw-bold"></div>
                <span class="badge bg-primary fs-4 px-3 py-2">
                    {{totalFlats}}
                </span>
            </div>
            <div class="col-4 col-md">
                <div class="fw-bold">Light Paid</div>
                <span class="badge bg-success fs-4 px-3 py-2">
                    {{lightPaid}}
                </span>
            </div>

            <div class="col-4 col-md">
                <div class="fw-bold">Light Pending</div>
                <span class="badge bg-danger fs-4 px-3 py-2">
                    {{lightPending}}
                </span>
            </div>
        </div>
    </div>
    <hr>

    <div *ngIf="isSelect" class="mt-3 d-flex justify-content-center flex-wrap gap-2">

        <button class="btn btn-success" (click)="markRentPaid()">
            Rent
        </button>

        <button class="btn btn-warning" (click)="markLightPaid()">
            Light
        </button>

    </div>

    <br>

    <table class="table table-bordered">

        <thead>
            <tr>
                <th>

                    <input type="checkbox" [checked]="isAllSelected()" (change)="toggleAll($event)">

                </th>

                <th>Flat</th>

                <th>Rent</th>

                <th>Light Bill</th>

            </tr>

        </thead>

        <tbody>

            <tr *ngFor="let flat of flats">

                <td>

                    <input *ngIf="!(flat.rentStatus === 'paid' && flat.lightBillStatus === 'paid')" type="checkbox"
                        [checked]="isSelected(flat.flatId)" (change)="toggleFlat(flat.flatId,$event)">

                    <span *ngIf="flat.rentStatus === 'paid' && flat.lightBillStatus === 'paid'"
                        class="text-success fw-bold">

                        ✓

                    </span>

                </td>

                <td>

                    {{flat.flatNumber}}

                </td>

                <td>

                    <span class="badge" [ngClass]="flat.rentStatus==='paid'?'bg-success':'bg-danger'"
                        (click)="flat.rentStatus!=='paid' && markSinglePaid(flat,'rent')" style="cursor:pointer">

                        {{flat.rentStatus}}

                    </span>

                </td>

                <td>

                    <span class="badge" [ngClass]="flat.lightBillStatus==='paid'?'bg-success':'bg-danger'"
                        (click)="flat.lightBillStatus!=='paid' && markSinglePaid(flat,'light')" style="cursor:pointer">

                        {{flat.lightBillStatus}}

                    </span>

                </td>

            </tr>

        </tbody>

    </table>

    <div class="mt-3 d-flex justify-content-center flex-wrap gap-2">

        <button class="btn btn-success" (click)="markRentPaid()">
            Rent
        </button>

        <button class="btn btn-warning" (click)="markLightPaid()">
            Light
        </button>

    </div>

</div>
