<!-- ================= DASHBOARD ================= -->

<!-- SUPER ADMIN DASHBOARD -->
<ng-container *ngIf="role === 'super_admin' && dashboard">

  <div class="dashboard-section mb-6">
    <div class="row g-4">
<!-- (click)="goTo('/apartments')" -->
      <div class="col-sm-6 col-xl-3" >
        <div class="dashboard-card clickable">
          <app-cards-widget7
            cssClass="bg-danger"
            [stats]="dashboard.summary.totalApartments"
            description="Total Apartments">
          </app-cards-widget7>
        </div>
      </div>
<!-- (click)="goTo('/flats')" -->
      <div class="col-sm-6 col-xl-3" >
        <div class="dashboard-card clickable">
          <app-cards-widget7
            cssClass="bg-success"
            [stats]="dashboard.summary.totalFlats"
            description="Total Flats">
          </app-cards-widget7>
        </div>
      </div>
<!-- (click)="goTo('/users')" -->
      <div class="col-sm-6 col-xl-3" >
        <div class="dashboard-card clickable">
          <app-cards-widget7
            cssClass="bg-warning"
            [stats]="dashboard.summary.totalUsers"
            description="Total Users">
          </app-cards-widget7>
        </div>
      </div>

      <div class="col-sm-6 col-xl-3">
        <div class="dashboard-card">
          <app-cards-widget7
            cssClass="bg-primary"
            [stats]="dashboard.summary.totalApartmentAdmins"
            description="Apartment Admins">
          </app-cards-widget7>
        </div>
      </div>

    </div>
  </div>

  <div class="dashboard-section mb-6">
    <div class="row g-4">

      <div class="col-sm-6 col-xl-3">
        <div class="dashboard-card">
          <app-cards-widget7
            cssClass="bg-success"
            description="Monthly Revenue"
            [stats]="dashboard.summary.monthlyRevenue"
            prefix="₹">
          </app-cards-widget7>
        </div>
      </div>
<!-- (click)="goTo('/complaints', { status: 'open' })" -->
      <div class="col-sm-6 col-xl-3" >
        <div class="dashboard-card clickable">
          <app-cards-widget7
            cssClass="bg-warning"
            description="Pending Complaints"
            [stats]="dashboard.summary.pendingComplaints">
          </app-cards-widget7>
        </div>
      </div>

      <div class="col-sm-6 col-xl-3">
        <div class="dashboard-card">
          <app-cards-widget7
            cssClass="bg-primary"
            description="Active Apartments"
            [stats]="dashboard.systemStats.activeApartments">
          </app-cards-widget7>
        </div>
      </div>

      <div class="col-sm-6 col-xl-3">
        <div class="dashboard-card">
          <app-cards-widget7
            cssClass="bg-danger"
            description="Inactive Apartments"
            [stats]="dashboard.systemStats.inactiveApartments">
          </app-cards-widget7>
        </div>
      </div>

    </div>
  </div>

</ng-container>

<!-- APARTMENT ADMIN DASHBOARD -->
<ng-container *ngIf="role === 'apartment_admin' && dashboard">

  <div class="dashboard-section mb-6">
    <div class="row g-4">

      <div class="col-sm-6 col-xl-3">
        <div class="dashboard-card">
          <app-cards-widget7 cssClass="bg-primary" [stats]="dashboard.totalFlats" description="Total Flats">
          </app-cards-widget7>
        </div>
      </div>

      <div class="col-sm-6 col-xl-3">
        <div class="dashboard-card">
          <app-cards-widget7 cssClass="bg-success" [stats]="dashboard.occupiedFlats" description="Occupied Flats">
          </app-cards-widget7>
        </div>
      </div>
<!-- (click)="goTo('/flats', { vacant: true })" -->
      <div class="col-sm-6 col-xl-3" >
        <div class="dashboard-card clickable">
          <app-cards-widget7 cssClass="bg-warning" [stats]="dashboard.vacantFlats" description="Vacant Flats">
          </app-cards-widget7>
        </div>
      </div>

      <div class="col-sm-6 col-xl-3">
        <div class="dashboard-card">
          <app-cards-widget7 cssClass="bg-info" [stats]="dashboard.vehicles" description="Vehicles">
          </app-cards-widget7>
        </div>
      </div>

    </div>
  </div>

</ng-container>

<!-- FLAT / RESIDENT DASHBOARD -->
<ng-container *ngIf="(role === 'flat_admin' || role === 'resident') && dashboard">

  <div class="dashboard-section mb-6">
    <div class="row g-4">

      <div class="col-sm-6 col-xl-3">
        <div class="dashboard-card">
          <app-cards-widget7
            cssClass="bg-primary"
            [stats]="dashboard.flatNumber"
            [description]="'Flat Number'">
          </app-cards-widget7>
        </div>
      </div>

      <div class="col-sm-6 col-xl-3">
        <div class="dashboard-card">
          <app-cards-widget7 cssClass="bg-success" [stats]="dashboard.members" description="Family Members">
          </app-cards-widget7>
        </div>
      </div>

      <div class="col-sm-6 col-xl-3">
        <div class="dashboard-card">
          <app-cards-widget7 cssClass="bg-info" [stats]="dashboard.vehicles" description="Vehicles">
          </app-cards-widget7>
        </div>
      </div>
<!-- (click)="goTo('/complaints', { mine: true, status: 'open' })" -->
      <div class="col-sm-6 col-xl-3" >
        <div class="dashboard-card clickable">
          <app-cards-widget7 cssClass="bg-danger" [stats]="dashboard.openComplaints" description="Open Complaints">
          </app-cards-widget7>
        </div>
      </div>

    </div>
  </div>

</ng-container>

<!-- QUICK ACTIONS -->
<div class="row mb-5">
  <div class="col-12">
    <app-quick-actions></app-quick-actions>
  </div>
</div>
