<!-- ================= DASHBOARD ================= -->
<!-- 🔔 Notification Enable Banner -->
<div *ngIf="showNotificationBanner" class="alert alert-info text-center">
  <span>
    🔔 Enable notifications to receive important updates.
  </span>
  <button class="btn btn-sm btn-primary ms-3" (click)="enableNotifications()">
    Enable
  </button>
</div>


<div *ngIf="errorMessage" class="alert alert-warning text-center">
  {{ errorMessage }}
</div>

<div *ngIf="loading" class="text-center">
  Loading dashboard...
</div>

<!-- dashboard cards -->

<!-- SUPER ADMIN DASHBOARD -->
<ng-container *ngIf="role === 'super_admin' && dashboard">

  <div class="dashboard-section mb-6">
    <div class="row g-4">

      <div class="col-6 col-xl-3">
        <div class="dashboard-card clickable">
          <app-cards-widget7 cssClass="bg-danger" [stats]="dashboard.summary.totalApartments"
            description="Total Apartment">
          </app-cards-widget7>
        </div>
      </div>

      <div class="col-6 col-xl-3">
        <div class="dashboard-card clickable">
          <app-cards-widget7 cssClass="bg-primary" [stats]="dashboard.summary.totalApartmentAdmins"
            description="Apartment Admin">
          </app-cards-widget7>
        </div>
      </div>

      <div class="col-6 col-xl-3">
        <div class="dashboard-card clickable">
          <app-cards-widget7 cssClass="bg-success" [stats]="dashboard.summary.totalFlats" description="Total Flat">
          </app-cards-widget7>
        </div>
      </div>

      <div class="col-6 col-xl-3">
        <div class="dashboard-card clickable">
          <app-cards-widget7 cssClass="bg-warning" [stats]="dashboard.summary.totalUsers" description="Total User">
          </app-cards-widget7>
        </div>
      </div>

    </div>
  </div>

  <div class="dashboard-section mb-6">
    <div class="row g-4">

      <div class="col-6 col-xl-3">
        <div class="dashboard-card clickable">
          <app-cards-widget7 cssClass="bg-success" description="Monthly Revenue"
            [stats]="dashboard.summary.monthlyRevenue" prefix="₹">
          </app-cards-widget7>
        </div>
      </div>

      <div class="col-6 col-xl-3">
        <div class="dashboard-card clickable">
          <app-cards-widget7 cssClass="bg-primary" description="Active Apartment"
            [stats]="dashboard.systemStats.activeApartments">
          </app-cards-widget7>
        </div>
      </div>

      <div class="col-6 col-xl-3">
        <div class="dashboard-card clickable">
          <app-cards-widget7 cssClass="bg-warning" description="Pending Complaint"
            [stats]="dashboard.summary.pendingComplaints">
          </app-cards-widget7>
        </div>
      </div>

      <div class="col-6 col-xl-3">
        <div class="dashboard-card clickable">
          <app-cards-widget7 cssClass="bg-danger" description="Inactive Apartment"
            [stats]="dashboard.systemStats.inactiveApartments">
          </app-cards-widget7>
        </div>
      </div>

    </div>
  </div>

</ng-container>

<!-- APARTMENT ADMIN DASHBOARD -->
<ng-container *ngIf="role === 'apartment_admin' && dashboard">

  <div class="dashboard-section mb-6">
    <div class="row g-4">

      <div class="col-6 col-xl-3">
        <div class="dashboard-card clickable">
          <app-cards-widget7 cssClass="bg-primary" [stats]="dashboard.totalFlats" description="Total Flat">
          </app-cards-widget7>
        </div>
      </div>

      <div class="col-6 col-xl-3">

          <app-cards-widget7 cssClass="bg-success" [stats]="dashboard.occupiedFlats" description="Taken Flat">

        </div>
      </div>

      <div class="col-6 col-xl-3">
        <div class="dashboard-card clickable">
          <app-cards-widget7 cssClass="bg-info" [stats]="dashboard.vacantFlats" description="Vacant Flat">
          </app-cards-widget7>
        </div>
      </div>

      <div class="col-6 col-xl-3">
        <div class="dashboard-card clickable">
          <app-cards-widget7 cssClass="bg-danger" [stats]="dashboard.openComplaints" description="Complaint">
          </app-cards-widget7> 
        </div>
      </div>

      <div class="col-6 col-xl-3">
        <div class="dashboard-card clickable">
          <app-cards-widget7 cssClass="bg-warning" [stats]="dashboard.pendingRent" description="Rent Uploads">
          </app-cards-widget7>
        </div>
      </div>

      <div class="col-6 col-xl-3">
        <div class="dashboard-card clickable">
          <app-cards-widget7 cssClass="bg-warning" [stats]="dashboard.pendingLightBills" description="Light Bill Uploads">
          </app-cards-widget7>
        </div>
      </div>

      <div class="col-6 col-xl-3">
        <div class="dashboard-card clickable">
          <app-cards-widget7 cssClass="bg-success" [stats]="dashboard.paidRent" description="Rent Paid">
          </app-cards-widget7>
        </div>
      </div>

      <div class="col-6 col-xl-3">
        <div class="dashboard-card clickable">
          <app-cards-widget7 cssClass="bg-success" [stats]="dashboard.paidLightBills" description="Light Bill Paid">
          </app-cards-widget7>
        </div>
      </div>

    </div>
  </div>

</ng-container>
