<div class="card">
  <div class="card-header">
    <h3 class="card-title">Quick Actions</h3>
  </div>

  <div class="card-body d-flex flex-wrap gap-3">

    <button *ngIf="canAddAdmin()" class="btn btn-primary" (click)="gotoAdmin()">
      ➕ Add Admin
    </button>

    <button *ngIf="canAddComplaint()" class="btn btn-warning">
      📝 Add Complaint
    </button>

    <button *ngIf="canAddVehicle()" class="btn btn-success">
      🚗 Add Vehicle
    </button>

    <button *ngIf="canAddMember()" class="btn btn-info">
      👤 Add Member
    </button>

  </div>
</div>
