<!-- begin::Header -->
<div class="card-header border-0 pt-5 d-flex justify-content-end">
  <div class="card-toolbar" data-bs-toggle="tooltip" data-bs-placement="top"
    title="Click to add Apartment">
    <button type="button" class="btn btn-success fw-bolder px-4"
      (click)="openAddModal(addModal, id)">
      + Add Apartment
    </button>
  </div>
</div>
<!-- end::Header -->

<!-- begin::Body -->
<div class="card-body py-3">

  <!-- begin::Table container -->
  <div class="table-responsive">
    <table class="table table-row-dashed table-row-gray-300 align-middle gs-0 gy-4">

      <thead>
        <tr class="fw-bolder">
          <th class="text-uppercase text-warning">SR</th>
          <th class="text-uppercase text-success">Name</th>
          <th class="text-uppercase text-primary">Address</th>
          <th class="text-uppercase text-info">Created</th>
          <th class="text-uppercase text-success">Status</th>
          <th class="text-uppercase text-center text-danger">Actions</th>
        </tr>
      </thead>

      <tbody>
        <tr *ngFor="let data of apartments; let i = index">
          <td>{{ i + 1 }}</td>

          <td class="fw-bolder">{{ data.name }}</td>

          <td>{{ data.address }}</td>

          <td>{{ data.createdAt | date:'dd MMM, yyyy' }}</td>

          <td>
            <span class="badge"
              [ngClass]="data.isActive ? 'badge-light-success' : 'badge-light-danger'">
              {{ data.isActive ? 'ACTIVE' : 'INACTIVE' }}
            </span>
          </td>

          <td class="text-center">
            <div class="d-flex justify-content-center gap-2">
              <button class="btn btn-sm btn-light-warning"
                (click)="openUpdateModal(addModal, data._id, data)">
                <app-keenicon name="pencil" class="fs-3"></app-keenicon>
              </button>

              <button class="btn btn-sm btn-light-danger"
                (click)="deleteApartment(data._id)">
                <app-keenicon name="trash" class="fs-3"></app-keenicon>
              </button>
            </div>
          </td>
        </tr>
      </tbody>

    </table>
  </div>
  <!-- end::Table container -->

</div>
<!-- end::Body -->

<!-- begin::Modal -->
<ng-template #addModal let-c="close" let-d="dismiss">

  <div class="modal-header">
    <h4 class="fw-bolder mb-0">
      {{ isAdd ? 'Add Apartment' : 'Update Apartment' }}
    </h4>
    <button type="button" class="btn btn-sm btn-danger"
      (click)="d('Cross click')">✕</button>
  </div>

  <div class="modal-body">

    <form [formGroup]="addForm">

      <!-- NAME -->
      <div class="mb-4">
        <label class="fw-bolder text-success">
          Name <span class="text-danger">*</span>
        </label>
        <input type="text"
          class="form-control form-control-lg"
          placeholder="Apartment Name"
          formControlName="name"
          (input)="toUppercase($event)">
      </div>

      <!-- ADDRESS -->
      <div class="mb-4">
        <label class="fw-bolder text-success">
          Address <span class="text-danger">*</span>
        </label>
        <input type="text"
          class="form-control form-control-lg"
          placeholder="Location eg. WAKAD PUNE"
          formControlName="address"
          (input)="toUppercase($event)">
      </div>

      <!-- ADDRESS -->
      <div class="mb-4">
        <label class="fw-bolder text-success">
          Full Address
        </label>
        <textarea class="form-control form-control-lg"
          rows="3"
          placeholder="Apartment Address"
          formControlName="address_lg"></textarea>
      </div>

    </form>

    <!-- ACTION BUTTONS -->
    <div class="d-flex justify-content-center gap-4 mt-5">
      <button class="btn btn-success px-5 fw-bolder"
        *ngIf="isAdd"
        (click)="addApartment()">
        Submit
      </button>

      <button class="btn btn-warning px-5 fw-bolder"
        *ngIf="!isAdd"
        (click)="updateApartment()">
        Update
      </button>

      <button class="btn btn-danger px-5 fw-bolder"
        (click)="closeModal()">
        Cancel
      </button>
    </div>

  </div>

</ng-template>
<!-- end::Modal -->
