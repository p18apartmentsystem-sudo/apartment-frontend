<form
  class="form w-100"
  [formGroup]="forgotPasswordForm"
  (ngSubmit)="submit()"
>

  <!-- Heading -->
  <div class="text-center mb-10">
    <h1 class="text-gray-900 fw-bolder mb-3">
      Forgot Password ?
    </h1>
    <div class="text-gray-500 fw-semibold fs-6">
      {{ step === 1 ? 'Enter your email to receive OTP'
        : step === 2 ? 'Enter OTP sent to your email'
        : 'Set new password' }}
    </div>
  </div>

  <!-- EMAIL -->
  <div class="fv-row mb-8" *ngIf="step === 1">
    <label class="form-label fw-bolder text-gray-900 fs-6">Email</label>
    <input
      class="form-control bg-transparent"
      type="email"
      formControlName="email"
      placeholder="Email"
    />
  </div>

  <!-- OTP -->
  <div class="fv-row mb-8" *ngIf="step === 2">
    <label class="form-label fw-bolder text-gray-900 fs-6">OTP</label>
    <input
      class="form-control bg-transparent"
      type="text"
      maxlength="6"
      formControlName="otp"
      placeholder="Enter 6 digit OTP"
    />
  </div>

  <!-- NEW PASSWORD -->
  <div class="fv-row mb-8" *ngIf="step === 3">
    <label class="form-label fw-bolder text-gray-900 fs-6">New Password</label>
    <input
      class="form-control bg-transparent"
      type="password"
      formControlName="newPassword"
      placeholder="New Password"
    />
  </div>

  <!-- BUTTONS -->
  <div class="d-flex justify-content-center">
    <button type="submit" class="btn btn-primary me-4">
      {{ step === 1 ? 'Send OTP'
        : step === 2 ? 'Verify OTP'
        : 'Reset Password' }}
    </button>

    <a (click)="gotoLogin()" class="btn btn-light">
      Cancel
    </a>
  </div>

</form>
